<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Camera — Focus Timer</title>
    <meta name="description" content="Focus-aware Pomodoro timer with webcam tracking — TypeScript 7 web port" />
    <meta name="theme-color" content="#1c1c1e" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:title" content="Pomodoro Camera — Focus Timer" />
    <meta property="og:description" content="Focus-aware Pomodoro timer with webcam tracking — stay concentrated, take breaks, track your streak." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob:; font-src 'self' data:;" />
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=()" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="app">
      <!-- Top bar -->
      <header class="topbar">
        <div class="brand">🍅 Pomodoro Camera</div>
        <div class="topbar-actions">
          <button id="btn-start" class="btn btn-accent" aria-label="Start or pause timer">Start</button>
          <button id="btn-reset" class="btn" aria-label="Reset timer">Reset</button>
          <button id="btn-settings" class="btn" aria-label="Open settings">Settings</button>
          <button id="btn-edit" class="btn btn-ghost" aria-label="Toggle layout edit mode">Edit Layout (E)</button>
        </div>
      </header>

      <!-- Main stage: video + canvas overlay -->
      <main class="stage">
        <div class="stage-inner" id="stage-inner">
          <video id="cam" autoplay playsinline muted></video>
          <canvas id="overlay"></canvas>
          <!-- HTML fallback overlays live inside #stage-inner as absolutely-positioned tiles -->
          <div id="layout-layer"></div>
        </div>
        <div id="camera-off" class="camera-off hidden">
          <div class="camera-off-card">Camera Off</div>
          <p class="camera-off-hint">Enable camera in Settings to start focus tracking.</p>
        </div>
      </main>

      <!-- Shortcuts hint -->
      <footer class="hintbar">
        <span><kbd>S</kbd> start/pause</span>
        <span><kbd>E</kbd> edit layout</span>
        <span><kbd>Esc</kbd> exit edit</span>
        <span><kbd>Q</kbd> quit focus (pause)</span>
      </footer>
    </div>

    <!-- Settings modal -->
    <dialog id="settings-dialog" class="settings-dialog">
      <form method="dialog" class="settings-form">
        <div class="settings-header">
          <h2>Settings</h2>
          <button type="submit" value="close" class="btn btn-small" aria-label="Close settings">Close</button>
        </div>

        <div class="settings-grid">
          <label class="field">
            <span>Pomodoro (min)</span>
            <span class="stepper">
              <button type="button" data-action="pom-minus" class="btn btn-small">−</button>
              <output id="out-pom">25</output>
              <button type="button" data-action="pom-plus" class="btn btn-small">+</button>
            </span>
          </label>

          <label class="field">
            <span>Break (min)</span>
            <span class="stepper">
              <button type="button" data-action="break-minus" class="btn btn-small">−</button>
              <output id="out-break">5</output>
              <button type="button" data-action="break-plus" class="btn btn-small">+</button>
            </span>
          </label>

          <label class="field">
            <span>Long Break (min)</span>
            <span class="stepper">
              <button type="button" data-action="long-minus" class="btn btn-small">−</button>
              <output id="out-long">15</output>
              <button type="button" data-action="long-plus" class="btn btn-small">+</button>
            </span>
          </label>

          <label class="field">
            <span>UI Scale</span>
            <span class="stepper">
              <button type="button" data-action="scale-minus" class="btn btn-small">−</button>
              <output id="out-scale">82%</output>
              <button type="button" data-action="scale-plus" class="btn btn-small">+</button>
            </span>
          </label>

          <label class="field">
            <span>Volume</span>
            <span class="stepper">
              <input type="range" id="volume-slider" min="0" max="100" value="70" style="width:120px" />
              <output id="out-volume">70%</output>
              <button type="button" data-action="volume-test" class="btn btn-small">Test</button>
            </span>
          </label>

          <div class="field row">
            <button type="button" data-action="toggle-camera" id="btn-toggle-camera" class="btn btn-small">Camera: On</button>
            <button type="button" data-action="toggle-bar" id="btn-toggle-bar" class="btn btn-small">Bar: On</button>
            <button type="button" data-action="toggle-alerts" id="btn-toggle-alerts" class="btn btn-small">Alerts: On</button>
          </div>

          <div class="field row">
            <button type="button" data-action="toggle-notifications" class="btn btn-small">Notifications: Off</button>
            <button type="button" data-action="toggle-auto-break" class="btn btn-small">Auto-break: Off</button>
            <button type="button" data-action="toggle-auto-pomo" class="btn btn-small">Auto-pomodoro: Off</button>
          </div>

          <div class="field row">
            <button type="button" data-action="toggle-theme" id="btn-toggle-theme" class="btn btn-small">Theme: Dark</button>
            <button type="button" data-action="toggle-corners" id="btn-toggle-corners" class="btn btn-small">Corners: Rounded</button>
          </div>

          <div class="field">
            <span>Display mode</span>
            <div class="row">
              <button type="button" data-action="mode-progress" class="btn btn-small">Progress</button>
              <button type="button" data-action="mode-popup" class="btn btn-small">Popup</button>
              <button type="button" data-action="mode-both" class="btn btn-small">Both</button>
            </div>
          </div>

          <div class="field">
            <span>Layout tiles</span>
            <div class="row">
              <button type="button" data-action="layout-timer" class="btn btn-small">Timer</button>
              <button type="button" data-action="layout-bar" class="btn btn-small">Bar</button>
              <button type="button" data-action="layout-focus" class="btn btn-small">Focus</button>
              <button type="button" data-action="layout-phase" class="btn btn-small">Phase</button>
            </div>
          </div>

          <div class="field row">
            <button type="button" data-action="layout-preset" class="btn btn-small">Presets</button>
            <button type="button" data-action="layout-reset" class="btn btn-small">Default</button>
            <button type="button" data-action="layout-grid" class="btn btn-small" id="btn-grid">Grid: 12×8</button>
          </div>

          <div class="field" style="flex-direction:column;align-items:stretch">
            <span>History & Focus</span>
            <div id="history-stats" style="font-size:12px;color:var(--subtext);margin:4px 0"></div>
            <canvas id="focus-chart" width="320" height="80" style="width:100%;height:80px;border-radius:8px;background:#1e1e22"></canvas>
            <div class="row" style="margin-top:8px">
              <button type="button" data-action="export-json" class="btn btn-small">Export JSON</button>
              <button type="button" data-action="export-csv" class="btn btn-small">Export CSV</button>
              <button type="button" data-action="clear-history" class="btn btn-small">Clear</button>
            </div>
          </div>
        </div>

        <div class="settings-footer">
          <button type="button" data-action="layout-edit" class="btn btn-accent">Layout Edit Mode</button>
        </div>
      </form>
    </dialog>

    <div id="live-region" aria-live="polite" aria-atomic="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden"></div>

    <!-- Onboarding overlay (HTML, mirrors Python's 6-step card) -->
    <div id="onboarding" class="onboarding hidden" role="dialog" aria-modal="true">
      <div class="onboarding-card">
        <div id="onboarding-bar" class="onboarding-bar"></div>
        <h2 id="onboarding-title">Welcome</h2>
        <p id="onboarding-body"></p>
        <div class="onboarding-dots" id="onboarding-dots"></div>
        <div class="onboarding-actions">
          <button id="onboarding-back" class="btn">Back</button>
          <button id="onboarding-skip" class="btn btn-ghost">Skip</button>
          <button id="onboarding-next" class="btn btn-accent">Next</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
