[project]
name = "pomodoro-camera"
version = "1.0.0"
description = "Focus-aware Pomodoro timer with webcam tracking — OpenCV + Pillow, themed UI, draggable layout"
readme = "../../README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.10.0,<5",
    "numpy>=1.24.0,<3",
    "pillow>=10.0.0",
    "python-dateutil>=2.8.0",
]
license = { text = "MIT" }
authors = [{ name = "Pomodoro Camera" }]

[project.scripts]
pomodoro-camera = "main:main"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["main"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
